<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <!-- A shoe seen from above, heel on the left, toe pointing along x. Drawn
       in greys and tinted with the shoes' color in the game (BodySprite). -->
  <path d="M 10 22
           C 10 12, 18 8, 32 9
           C 52 7, 72 5, 84 10
           C 93 14, 93 30, 84 34
           C 72 39, 52 37, 32 35
           C 18 36, 10 32, 10 22 Z"
        fill="#cfcfcf" stroke="#6e6e6e" stroke-width="5"/>
  <!-- The toe catches the light -->
  <ellipse cx="74" cy="17" rx="10" ry="5" fill="#ffffff"/>
  <!-- Laces -->
  <path d="M 40 22 L 62 22" stroke="#00000030" stroke-width="5" stroke-linecap="round"/>
</svg>
