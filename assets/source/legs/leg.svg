<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48" viewBox="0 0 120 48">
  <!-- A leg seen from above, hip to ankle along x. Drawn in greys and tinted
       with the trousers' color in the game (BodySprite), so white is the
       color itself. Stretched to fit: the ends are rounded for the joints. -->
  <rect x="3" y="3" width="114" height="42" rx="21"
        fill="#e4e4e4" stroke="#9a9a9a" stroke-width="5"/>
  <!-- Light from above: the top of the leg -->
  <rect x="14" y="12" width="92" height="12" rx="6" fill="#ffffff"/>
  <!-- A crease down the front -->
  <path d="M 30 30 C 55 32, 75 31, 98 29" stroke="#00000022" stroke-width="3" fill="none"/>
</svg>
