<svg xmlns="http://www.w3.org/2000/svg" width="312" height="66" viewBox="0 0 312 66">
  <!-- A P90 magazine: a long translucent box that lies on top of the gun,
       with the rounds crosswise inside. 0.26 m long. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cf8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8f8650" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="rounds" width="12" height="66" patternUnits="userSpaceOnUse">
      <rect x="2" y="14" width="7" height="38" rx="2" fill="#c9a240"/>
      <rect x="2" y="14" width="7" height="8" rx="2" fill="#7a6a40"/>
    </pattern>
  </defs>
  <rect x="6" y="8" width="300" height="50" rx="10"
        fill="url(#shell)" stroke="#3d3a22" stroke-width="4"/>
  <rect x="20" y="12" width="270" height="42" fill="url(#rounds)" opacity="0.8"/>
  <rect x="6" y="8" width="300" height="50" rx="10"
        fill="none" stroke="#3d3a22" stroke-width="4"/>
  <!-- The dark ends -->
  <rect x="2" y="6" width="18" height="54" rx="5" fill="#2a2a2a" stroke="#111" stroke-width="3"/>
  <rect x="292" y="6" width="18" height="54" rx="5" fill="#2a2a2a" stroke="#111" stroke-width="3"/>
</svg>
