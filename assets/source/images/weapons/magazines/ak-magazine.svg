<svg xmlns="http://www.w3.org/2000/svg" width="288" height="110" viewBox="0 0 288 110">
  <!-- An AK-47 magazine from the side: the banana curve, in orange bakelite
       like the rifle's furniture. 0.24 m long. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9772e"/>
      <stop offset="0.55" stop-color="#9a5420"/>
      <stop offset="1" stop-color="#6b3612"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#a87a28"/>
    </linearGradient>
  </defs>
  <!-- The curve -->
  <path d="M 16 40 Q 130 6 258 18 L 262 72 Q 140 62 22 100 Z"
        fill="url(#body)" stroke="#2b1405" stroke-width="4" stroke-linejoin="round"/>
  <!-- Ribs along it -->
  <path d="M 60 30 Q 150 12 240 22 M 64 82 Q 150 62 240 64"
        stroke="#00000044" stroke-width="3" fill="none"/>
  <!-- Base plate -->
  <path d="M 6 38 L 24 32 L 32 100 L 14 106 Z"
        fill="#3a2a1e" stroke="#2b1405" stroke-width="4" stroke-linejoin="round"/>
  <!-- Feed lips and the top round -->
  <rect x="252" y="24" width="18" height="42" rx="3" fill="#2a1e14" stroke="#1a0e05" stroke-width="3"/>
  <path d="M 258 32 L 272 32 Q 284 45 272 58 L 258 58 Z"
        fill="url(#brass)" stroke="#5a3e10" stroke-width="2"/>
</svg>
